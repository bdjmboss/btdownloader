name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Build with Buildozer
      id: build
      env:
        APP_ANDROID_ACCEPT_SDK_LICENSE: 1
        BUILDOZER_WARN_ON_ROOT: 0
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk python3-pip python3-venv autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

        # Create venv with Python 3.10
        python3.10 -m venv buildenv
        source buildenv/bin/activate
        pip install --upgrade pip
        pip install buildozer Cython virtualenv

        # Clone stable p4a release tag (NOT master, which has libthorvg recipe bug)
        git clone --depth=1 --branch v2026.05.09 https://github.com/kivy/python-for-android.git /tmp/p4a
        echo "Using p4a version:"
        git -C /tmp/p4a describe --tags || true

        rm -rf .buildozer .buildozer_global
        cd ${{ github.workspace }}
        set -o pipefail
        BUILDOZER_P4A_SOURCE_DIR=/tmp/p4a buildozer android debug 2>&1 | tee /tmp/build_output.log
        ls -lh bin/*.apk

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: btdownloader-apk
        path: bin/*.apk
        retention-days: 30
        overwrite: true

    - name: Upload build log on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-failure-log
        path: |
          /tmp/build_output.log
          .buildozer/android/platform/build-*/build.log
        retention-days: 7
        if-no-files-found: warn
