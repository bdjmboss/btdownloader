name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Build with Buildozer
      id: build
      env:
        APP_ANDROID_ACCEPT_SDK_LICENSE: 1
        BUILDOZER_WARN_ON_ROOT: 0
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk python3-pip python3-venv autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev wget bzip2

        # Android Gradle Plugin requires Java 17. Runner defaults to Java 11, so override.
        export JAVA_HOME=${JAVA_HOME_17_X64:-/usr/lib/jvm/temurin-17-jdk-amd64}
        export PATH="$JAVA_HOME/bin:$PATH"
        echo "Using JAVA_HOME=$JAVA_HOME"
        "$JAVA_HOME/bin/java" -version
        which java && java -version 2>&1 | head -1

        # Create venv with Python 3.10
        python3.10 -m venv buildenv
        source buildenv/bin/activate
        pip install --upgrade pip
        pip install buildozer Cython virtualenv

        # Clone stable p4a release tag (NOT master, which has libthorvg recipe bug)
        git clone --depth=1 --branch v2026.05.09 https://github.com/kivy/python-for-android.git /tmp/p4a
        echo "Using p4a version:"
        git -C /tmp/p4a describe --tags || true

        # Fix open_rich_spinner ImportError (pip 24.1+ removed this function)
        # Inject sitecustomize.py via PYTHONPATH to auto-downgrade pip in any venv
        mkdir -p /tmp/pipfix
        echo '' | base64 -d > /tmp/pipfix/sitecustomize.py
        export PYTHONPATH=/tmp/pipfix:$PYTHONPATH
        echo "Injected sitecustomize.py to auto-downgrade pip in venvs"

        # --- 构建函数：带心跳的后台构建 ---
        run_buildozer() {
          local logfile=$1
          : > "$logfile"
          BUILDOZER_P4A_SOURCE_DIR=/tmp/p4a buildozer android debug >> "$logfile" 2>&1 &
          local BUILD_PID=$!
          while kill -0 $BUILD_PID 2>/dev/null; do
            sleep 60
            echo "  ... building ($(wc -l < "$logfile") lines logged)"
          done
          wait $BUILD_PID
          return $?
        }

        rm -rf .buildozer .buildozer_global
        cd ${{ github.workspace }}

        # ========== 第一次尝试：含 libtorrent ==========
        echo "========== Attempt 1: WITH libtorrent =========="
        run_buildozer /tmp/build_output.log
        BUILD_STATUS=$?
        echo "Build attempt 1 exit status: $BUILD_STATUS"
        echo "Total log lines: $(wc -l < /tmp/build_output.log)"

        if [ $BUILD_STATUS -ne 0 ]; then
          echo ""
          echo "========== Attempt 1 FAILED =========="
          echo "=== Last 80 lines ==="
          tail -80 /tmp/build_output.log
          echo ""
          echo "=== Error lines (libtorrent/boost/recipe related) ==="
          grep -inE "libtorrent|boost|recipe|error|failed|traceback|exception|fatal|cannot|denied|no such" /tmp/build_output.log | grep -viE "DEBUG.*(Compiling|install|/usr/bin|cp |mkdir|ar |clang|ranlib)|0 error" | tail -30

          # 保存失败日志
          cp /tmp/build_output.log /tmp/build_output_libtorrent_failed.log

          # ========== 回退：不含 libtorrent（mock 模式）==========
          echo ""
          echo "========== Attempt 2: FALLBACK without libtorrent (mock mode) =========="
          sed -i 's/, libtorrent//' buildozer.spec
          echo "Updated requirements: $(grep '^requirements' buildozer.spec)"

          # 清理构建缓存（保留下载的 SDK/NDK/Python 以加速）
          rm -rf .buildozer/android/platform/build-*
          rm -rf .buildozer/android/app/build
          # 保留 .buildozer/android/platform/android-* (SDK/NDK)
          # 保留 .buildozer/android/packages (Python/Kivy 编译缓存)

          run_buildozer /tmp/build_output_fallback.log
          FALLBACK_STATUS=$?
          echo "Fallback build exit status: $FALLBACK_STATUS"

          if [ $FALLBACK_STATUS -ne 0 ]; then
            echo "=== Fallback also FAILED ==="
            tail -80 /tmp/build_output_fallback.log
            grep -inE "error|failed|traceback|exception|fatal|cannot|denied|no such" /tmp/build_output_fallback.log | grep -viE "DEBUG.*(Compiling|install|/usr/bin|cp |mkdir|ar |clang|ranlib)|0 error" | tail -20
            echo "::error::Both libtorrent and fallback builds failed"
            exit 1
          fi
          # 回退成功，用回退日志
          cp /tmp/build_output_fallback.log /tmp/build_output.log
          echo "WARNING: APK built in MOCK mode (libtorrent build failed, downloading is simulated)"
        fi
        ls -lh bin/*.apk

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: btdownloader-apk
        path: bin/*.apk
        retention-days: 30
        overwrite: true

    - name: Upload build log on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-failure-log
        path: |
          /tmp/build_output.log
          /tmp/build_output_libtorrent_failed.log
          /tmp/build_output_fallback.log
          .buildozer/android/platform/build-*/build.log
        retention-days: 7
        if-no-files-found: warn
