name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Get Date for Cache
      id: get-date
      run: echo "date=$(/bin/date -u '+%Y%m%d')" >> $GITHUB_OUTPUT
      shell: bash

    - name: Cache Buildozer global
      uses: actions/cache@v4
      with:
        path: .buildozer_global
        key: buildozer-global-${{ hashFiles('buildozer.spec') }}

    - name: Cache Buildozer build
      uses: actions/cache@v4
      with:
        path: .buildozer
        key: buildozer-build-${{ steps.get-date.outputs.date }}-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          buildozer-build-${{ steps.get-date.outputs.date }}-
          buildozer-build-

    - name: Install system dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

    - name: Install buildozer
      run: |
        pip3 install --user --upgrade buildozer Cython virtualenv
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Build APK
      env:
        APP_ANDROID_ACCEPT_SDK_LICENSE: 1
        BUILDOZER_WARN_ON_ROOT: 0
      run: |
        buildozer android debug
        ls -lh bin/*.apk

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: btdownloader-apk
        path: bin/*.apk
        retention-days: 30
