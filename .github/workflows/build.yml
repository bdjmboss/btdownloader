name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Build with Buildozer
      id: build
      env:
        APP_ANDROID_ACCEPT_SDK_LICENSE: 1
        BUILDOZER_WARN_ON_ROOT: 0
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk python3-pip python3-venv autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

        # Create venv with Python 3.10
        python3.10 -m venv buildenv
        source buildenv/bin/activate
        pip install --upgrade pip
        pip install buildozer Cython virtualenv

        # Clone stable p4a release tag (NOT master, which has libthorvg recipe bug)
        git clone --depth=1 --branch v2026.05.09 https://github.com/kivy/python-for-android.git /tmp/p4a
        echo "Using p4a version:"
        git -C /tmp/p4a describe --tags || true

        # Fix open_rich_spinner ImportError (pip 24.1+ removed this function)
        # Inject sitecustomize.py via PYTHONPATH to auto-downgrade pip in any venv
        mkdir -p /tmp/pipfix
        echo '' | base64 -d > /tmp/pipfix/sitecustomize.py
        export PYTHONPATH=/tmp/pipfix:$PYTHONPATH
        echo "Injected sitecustomize.py to auto-downgrade pip in venvs"

        rm -rf .buildozer .buildozer_global
        cd ${{ github.workspace }}
        set -o pipefail
        if ! BUILDOZER_P4A_SOURCE_DIR=/tmp/p4a buildozer android debug 2>&1 | tee /tmp/build_output.log; then
          echo ""
          echo "========== BUILD FAILED =========="
          echo "=== Last 100 lines of build log ==="
          tail -100 /tmp/build_output.log
          echo ""
          echo "=== Error lines from build log ==="
          grep -in "error\|failed\|traceback\|exception" /tmp/build_output.log | tail -30
          echo ""
          # Emit GitHub Actions error annotations (visible via API without login)
          grep -in "error\|failed\|traceback\|exception" /tmp/build_output.log | grep -v "DEBUG\|Compiling\|0 error" | tail -10 | while IFS= read -r line; do
            msg=$(echo "$line" | cut -c1-250)
            echo "::error::$msg"
          done
          echo "==================================="
          exit 1
        fi
        ls -lh bin/*.apk

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: btdownloader-apk
        path: bin/*.apk
        retention-days: 30
        overwrite: true

    - name: Upload build log on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-failure-log
        path: |
          /tmp/build_output.log
          .buildozer/android/platform/build-*/build.log
        retention-days: 7
        if-no-files-found: warn
