name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v3

    - name: Build with Buildozer
      env:
        APP_ANDROID_ACCEPT_SDK_LICENSE: 1
        BUILDOZER_WARN_ON_ROOT: 0
      run: |
        # Show Python versions available
        echo "=== Python versions ==="
        python3 --version || true
        which python3 || true
        ls -la /usr/bin/python3* || true

        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk python3-pip python3-venv python3.10-venv autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

        # Force python3 to be 3.10 (not 3.14)
        sudo update-alternatives --install /usr/bin/python3 python3 /usr/bin/python3.10 1
        sudo update-alternatives --set python3 /usr/bin/python3.10
        python3 --version

        # Install buildozer with system Python 3.10
        pip3 install --user --upgrade buildozer Cython virtualenv
        export PATH=$PATH:~/.local/bin/

        # Fresh build, no cache
        rm -rf .buildozer .buildozer_global
        cd ${{ github.workspace }}
        buildozer android debug
        ls -lh bin/*.apk

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: btdownloader-apk
        path: bin/*.apk
        retention-days: 30
        overwrite: true
