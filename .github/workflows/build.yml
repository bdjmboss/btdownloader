name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Build with Buildozer
      id: build
      env:
        APP_ANDROID_ACCEPT_SDK_LICENSE: 1
        BUILDOZER_WARN_ON_ROOT: 0
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk python3-pip python3-venv autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

        # Android Gradle Plugin requires Java 17. Runner defaults to Java 11, so override.
        export JAVA_HOME=${JAVA_HOME_17_X64:-/usr/lib/jvm/temurin-17-jdk-amd64}
        export PATH="$JAVA_HOME/bin:$PATH"
        echo "Using JAVA_HOME=$JAVA_HOME"
        "$JAVA_HOME/bin/java" -version
        which java && java -version 2>&1 | head -1

        # Create venv with Python 3.10
        python3.10 -m venv buildenv
        source buildenv/bin/activate
        pip install --upgrade pip
        pip install buildozer Cython virtualenv

        # Clone stable p4a release tag (NOT master, which has libthorvg recipe bug)
        git clone --depth=1 --branch v2026.05.09 https://github.com/kivy/python-for-android.git /tmp/p4a
        echo "Using p4a version:"
        git -C /tmp/p4a describe --tags || true

        # Fix open_rich_spinner ImportError (pip 24.1+ removed this function)
        # Inject sitecustomize.py via PYTHONPATH to auto-downgrade pip in any venv
        mkdir -p /tmp/pipfix
        echo '' | base64 -d > /tmp/pipfix/sitecustomize.py
        export PYTHONPATH=/tmp/pipfix:$PYTHONPATH
        echo "Injected sitecustomize.py to auto-downgrade pip in venvs"

        rm -rf .buildozer .buildozer_global
        cd ${{ github.workspace }}
        echo "Starting build. ALL buildozer output goes to /tmp/build_output.log (downloadable artifact)."
        echo "Console shows only a heartbeat + final summary, so GitHub Actions UI will NEVER truncate."
        : > /tmp/build_output.log

        # Run buildozer in background with ALL output to file only (nothing to console)
        BUILDOZER_P4A_SOURCE_DIR=/tmp/p4a buildozer android debug >> /tmp/build_output.log 2>&1 &
        BUILD_PID=$!

        # Heartbeat: print one line every 45s so the step is visibly alive but console stays tiny
        while kill -0 $BUILD_PID 2>/dev/null; do
          sleep 45
          echo "  ... building ($(wc -l < /tmp/build_output.log) lines logged)"
        done
        wait $BUILD_PID
        BUILD_STATUS=$?
        echo "Build exit status: $BUILD_STATUS"
        echo "Total log lines: $(wc -l < /tmp/build_output.log)"

        if [ $BUILD_STATUS -ne 0 ]; then
          echo ""
          echo "========== BUILD FAILED =========="
          echo "=== Last 120 lines of build log ==="
          tail -120 /tmp/build_output.log
          echo ""
          echo "=== Error/warning lines (excluding [DEBUG] file-op noise) ==="
          grep -inE "error|failed|traceback|exception|fatal|cannot|denied|no such" /tmp/build_output.log | grep -viE "DEBUG.*(Compiling|install|/usr/bin|cp |mkdir|ar |clang|ranlib)|0 error" | tail -50
          echo ""
          # Emit GitHub Actions error annotations (visible via API without login)
          echo "=== GitHub Actions error annotations ==="
          grep -inE "error|failed|traceback|exception|fatal|cannot|denied|no such" /tmp/build_output.log | grep -viE "DEBUG.*(Compiling|install|/usr/bin|cp |mkdir|ar |clang|ranlib)|0 error" | tail -10 | while IFS= read -r line; do
            msg=$(echo "$line" | cut -c1-250)
            echo "::error::$msg"
          done
          echo "==================================="
          echo "Download the 'build-failure-log' artifact for the FULL unfiltered log."
          exit 1
        fi
        ls -lh bin/*.apk

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: btdownloader-apk
        path: bin/*.apk
        retention-days: 30
        overwrite: true

    - name: Upload build log on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-failure-log
        path: |
          /tmp/build_output.log
          .buildozer/android/platform/build-*/build.log
        retention-days: 7
        if-no-files-found: warn
